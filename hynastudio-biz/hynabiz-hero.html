    /* star dust + vignette over the globe artwork */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(1px 1px at 12% 18%, rgba(255, 255, 255, .55) 50%, transparent 51%),
        radial-gradient(1px 1px at 26% 9%, rgba(255, 255, 255, .35) 50%, transparent 51%),
        radial-gradient(1.4px 1.4px at 46% 14%, rgba(255, 255, 255, .45) 50%, transparent 51%),
        radial-gradient(1px 1px at 68% 8%, rgba(255, 255, 255, .40) 50%, transparent 51%),
        radial-gradient(1px 1px at 82% 22%, rgba(255, 255, 255, .30) 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 91% 12%, rgba(255, 255, 255, .45) 50%, transparent 51%),
        radial-gradient(1px 1px at 7% 40%, rgba(255, 255, 255, .28) 50%, transparent 51%),
        radial-gradient(1px 1px at 57% 27%, rgba(255, 255, 255, .26) 50%, transparent 51%);
      pointer-events: none;
      z-index: 1;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 70% at 50% 8%, rgba(2, 8, 22, .78) 0%, rgba(2, 8, 22, .18) 55%, transparent 80%),
        linear-gradient(to bottom, rgba(2, 8, 22, .55) 0%, transparent 30%, transparent 70%, rgba(2, 8, 22, .45) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .hero>* {
      position: relative;
      z-index: 2;
    }

    /* ---------- NAVBAR ---------- */
    .nav {
      width: 100%;
      max-width: var(--shell);
      margin: 0 auto;
      padding: 24px 28px 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 100;
    }

    .brand {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      letter-spacing: -.02em;
      text-decoration: none;
      color: var(--ink);
      white-space: nowrap;
      user-select: none;
      transition: opacity .18s ease;
    }

    .brand:hover {
      opacity: .92;
    }

    .brand-logo {
      height: 30px;
      width: auto;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(62, 168, 255, .35));
      transition: transform .18s ease;
    }

    .brand:hover .brand-logo {
      transform: scale(1.05);
    }

    .brand-text {
      display: inline-flex;
      align-items: center;
      gap: 1.5px;
      font-family: 'Krona One', sans-serif;
      font-size: 19px;
      letter-spacing: -0.01em;
    }

    .brand-text b {
      font-family: 'Krona One', sans-serif;
      font-weight: 400;
      color: #ffffff;
    }

    .brand-text>span {
      font-family: 'Krona One', sans-serif;
      font-weight: 400;
      color: rgba(220, 235, 255, .78);
    }

    .brand-text i {
      font-family: 'Krona One', sans-serif;
      font-style: normal;
      color: var(--glow);
    }

    .nav-menu {
      justify-self: center;
    }

    .nav-links {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      list-style: none;
      margin: 0;
      padding: 5px 6px;
      background: rgba(10, 26, 48, .62);
      border: 1px solid rgba(120, 190, 255, .25);
      border-radius: var(--radius-pill);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 32px rgba(2, 10, 26, .45), inset 0 1px 0 rgba(255, 255, 255, .12);
    }

    .nav-links li {
      display: flex;
      align-items: center;
    }

    .nav-links a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      color: rgba(226, 238, 255, .82);
      font-size: 13.5px;
      font-weight: 500;
      padding: 7px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid transparent;
      white-space: nowrap;
      transition: color .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .nav-links a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, .08);
    }

    .nav-links .is-active {
      color: #ffffff;
      background: rgba(255, 255, 255, .14);
      border-color: rgba(160, 215, 255, .32);
      box-shadow: 0 2px 10px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .18);
    }

    .nav-links svg {
      width: 15px;
      height: 15px;
      flex: none;
    }

    .nav-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .login {
      text-decoration: none;
      color: rgba(226, 238, 255, .82);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      transition: color .18s ease, background .18s ease;
    }

    .login:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, .06);
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      background: rgba(255, 255, 255, .96);
      color: #061529;
      font-size: 14px;
      font-weight: 600;
      padding: 7px 7px 7px 20px;
      border-radius: var(--radius-pill);
      box-shadow: 0 10px 30px rgba(3, 20, 45, .45);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .btn-pill .arrow {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #08172c;
      color: #fff;
      display: grid;
      place-items: center;
      flex: none;
      transition: transform .18s ease;
    }

    .btn-pill .arrow svg {
      width: 14px;
      height: 14px;
    }

    .btn-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 34px rgba(3, 20, 45, .55);
    }

    .btn-pill:hover .arrow {
      transform: translate(1px, -1px);
    }

    .nav-toggle {
      display: none;
      background: rgba(10, 26, 48, .55);
      border: 1px solid var(--glass-line);
      color: var(--ink);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background .18s ease;
    }

    .nav-toggle:hover {
      background: rgba(255, 255, 255, .1);
    }

    /* ---------- HERO CONTENT ---------- */
    .hero-body {
      flex: 1;
      width: 100%;
      max-width: var(--shell);
      margin: 0 auto;
      padding: clamp(10px, 2.2vh, 32px) clamp(16px, 3vw, 28px) clamp(16px, 2.8vh, 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: space-between;
      box-sizing: border-box;
    }

    .kicker {
      margin: 0 0 clamp(4px, 1vh, 12px);
      font-size: clamp(12.5px, 1.3vw, 15px);
      font-weight: 400;
      color: var(--ink-soft);
      letter-spacing: .01em;
    }

    .wordmark {
      margin: 0;
      font-size: clamp(2.4rem, 7.5vw, 7.5rem);
      font-weight: 700;
      line-height: .92;
      letter-spacing: -.045em;
      background: linear-gradient(178deg, #f4f9ff 6%, #cfe4fb 42%, #7fb6e8 72%, #4f8dc4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 42px rgba(62, 168, 255, .38));
    }

    .cta-row {
      margin-top: auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* ---------- FLOATING FEATURE PILLS ---------- */
    .features {
      position: relative;
      width: 100%;
      max-width: 960px;
      margin-top: auto;
      padding-top: clamp(8px, 1.6vh, 20px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 36px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 9px 18px 9px 9px;
      border-radius: var(--radius-pill);
      background: var(--glass);
      border: 1px solid var(--glass-line);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 34px rgba(2, 10, 26, .42);
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.25;
      text-align: left;
      justify-self: start;
      max-width: 100%;
    }

    .chip .ic {
      width: 32px;
      height: 32px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .04));
      border: 1px solid rgba(160, 210, 255, .30);
      color: #cfe8ff;
    }

    .chip .ic svg {
      width: 16px;
      height: 16px;
    }

    /* scattered placement that mirrors the reference layout */
    .chip-assets {
      justify-self: center;
      transform: translate(-18%, clamp(-44px, -4.5vh, -18px));
    }

    .chip-leverage {
      justify-self: end;
      transform: translate(4%, clamp(-20px, -2.2vh, -8px));
    }

    .chip-execution {
      justify-self: start;
      transform: translate(-4%, 0);
    }

    .chip-tools {
      justify-self: center;
      transform: translate(10%, 0);
    }

    /* ---------- ACCESSIBILITY / RESPONSIVE ---------- */
    a:focus-visible,
    button:focus-visible {
      outline: 2px solid #8ecbff;
      outline-offset: 3px;
    }

    @media (max-width: 1024px) {
      .nav {
        display: flex;
        justify-content: space-between;
      }

      .nav-links {
        position: fixed;
        top: 80px;
        left: 20px;
        right: 20px;
        flex-direction: column;
        padding: 16px;
        border-radius: 20px;
        gap: 6px;
        background: rgba(4, 16, 36, 0.96);
        border: 1px solid rgba(120, 190, 255, 0.3);
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s;
      }

      .nav-links.is-open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .nav-links li {
        width: 100%;
      }

      .nav-links a {
        width: 100%;
        justify-content: center;
        padding: 11px 16px;
        font-size: 14.5px;
      }

      .nav-toggle {
        display: grid;
        place-items: center;
      }
    }

    @media (max-width:760px) {
      body {
        padding: 0;
      }

      .hero {
        border-radius: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 100vh;
        min-height: 100dvh;
        background-position: center 68%;
      }

      .nav {
        padding: 12px 14px 0;
      }

      .login {
        display: none;
      }

      .hero-body {
        padding: 14px 12px 14px;
      }

      .cta-row {
        justify-content: center;
        gap: 10px;
        margin-top: 10px;
      }

      .features {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px 10px;
        max-width: 100%;
        padding-top: 10px;
      }

      .chip {
        font-size: 11.5px;
        padding: 6px 10px 6px 6px;
        gap: 6px;
      }

      .chip .ic {
        width: 26px;
        height: 26px;
      }

      .chip .ic svg {
        width: 13px;
        height: 13px;
      }

      .chip,
      .chip-assets,
      .chip-leverage,
      .chip-execution,
      .chip-tools {
        transform: none;
        justify-self: stretch;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <section class="hero" id="hero">

    <!-- ============ NAVBAR ============ -->
    <header class="nav">
      <a class="brand" href="#hero">
        <img class="brand-logo" src="Screenshot_2026-09-19_at_5.25.50_PM-removebg-preview.png" alt="HynaBiz Logo" />
        <span class="brand-text"><b>HYNA</b><span>BIZ</span><i></i></span>
      </a>

      <nav class="nav-menu" aria-label="Main">
        <ul class="nav-links">
          <li>
            <a class="is-active" href="#hero">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M3 10.5 12 3l9 7.5" />
                <path d="M5 9.5V21h14V9.5" />
                <path d="M10 21v-6h4v6" />
              </svg>
              Home
            </a>
          </li>
          <li><a href="#features">About Us</a></li>
          <li><a href="#features">Resources</a></li>
          <li><a href="#pricing">FAQ</a></li>
          <li><a href="#features">BizAI</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <a class="login" href="#">Login</a>
        <a class="btn-pill" href="#pricing">
          Sign Up
          <span class="arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M7 17 17 7" />
              <path d="M8 7h9v9" />
            </svg>
          </span>
        </a>
        <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            aria-hidden="true">
            <path d="M4 7h16" />
            <path d="M4 12h16" />
            <path d="M4 17h16" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ============ HERO CONTENT ============ -->
    <div class="hero-body">
    </div>

  </section>

  <script>
    (function () {
      var toggle = document.querySelector('.nav-toggle');
      var navLinks = document.querySelector('.nav-links');
      if (toggle && navLinks) {
        toggle.addEventListener('click', function (e) {
          e.stopPropagation();
          navLinks.classList.toggle('is-open');
          var isOpen = navLinks.classList.contains('is-open');
          toggle.setAttribute('aria-expanded', isOpen);
        });
        document.addEventListener('click', function (e) {
          if (!navLinks.contains(e.target) && !toggle.contains(e.target)) {
            navLinks.classList.remove('is-open');
            toggle.setAttribute('aria-expanded', 'false');
          }
        });
      }

      var links = document.querySelectorAll('.nav-links a');
      links.forEach(function (link) {
        link.addEventListener('click', function () {
          links.forEach(function (l) { l.classList.remove('is-active'); });
          this.classList.add('is-active');
          if (navLinks) {
            navLinks.classList.remove('is-open');
            if (toggle) toggle.setAttribute('aria-expanded', 'false');
          }
        });
      });
    })();
  </script>
</body>

</html>
