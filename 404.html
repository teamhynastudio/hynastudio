<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1B1FN1XNL0"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-1B1FN1XNL0');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Hyna Studio™</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #07070d;
            --accent1: #3b82f6;     /* Electric Blue */
            --accent2: #00d9a3;     /* Emerald Green */
            --accent3: #6366f1;     /* Neon Purple */
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border-color: rgba(59, 130, 246, 0.25);
            --font-display: 'Syne', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 24px;
        }

        /* ── FUTURISTIC BACKGROUND GRID & ORBS ── */
        .grid-background {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -2;
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
            will-change: transform;
        }

        .glow-orb-1 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--accent1) 0%, transparent 70%);
            top: -50px;
            left: -50px;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }

        .glow-orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent3) 0%, transparent 70%);
            bottom: -100px;
            right: -100px;
            animation: orbFloat 25s ease-in-out infinite alternate-reverse;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.1); }
        }

        /* ── Glassmorphic 404 Panel ── */
        .error-card {
            width: 100%;
            max-width: 540px;
            background: rgba(13, 20, 48, 0.45);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 
                0 8px 32px rgba(14, 165, 233, 0.08),
                0 20px 48px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 10;
        }

        .tag {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent2);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
            display: inline-block;
            background: rgba(0, 217, 163, 0.08);
            border: 1px solid rgba(0, 217, 163, 0.2);
            padding: 6px 16px;
            border-radius: 100px;
        }

        .error-code {
            font-family: var(--font-display);
            font-size: clamp(6rem, 15vw, 8.5rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, var(--text-primary) 30%, var(--accent1) 70%, var(--accent3) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            position: relative;
            user-select: none;
            filter: drop-shadow(0 0 30px rgba(99, 102, 241, 0.15));
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        p {
            font-size: 0.98rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        /* ── Interactive CTAs ── */
        .actions-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent1) 0%, var(--accent3) 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.5);
            filter: brightness(1.1);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }

        /* ── Responsive styling ── */
        @media (max-width: 480px) {
            .error-card {
                padding: 36px 20px;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            .actions-group {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="grid-background"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="error-card">
        <span class="tag">Error Code: System Offline</span>
        <div class="error-code">404</div>
        <h1>Lost in Digital Space?</h1>
        <p>The page you are looking for has been moved, deleted, or does not exist in our system directory.</p>
        
        <div class="actions-group">
            <a href="index.html" class="btn btn-primary">
                Return to Home →
            </a>
            <a href="javascript:history.back()" class="btn btn-outline">
                ← Go Back
            </a>
        </div>
    </div>

</body>
</html>
