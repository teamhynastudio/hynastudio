<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Terminologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --wordmark:#232323;
    --accent:#4D6BFF;
    --white:#F5F5F5;
    --gray:#9A9A9A;
    --border:#1E1E1E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    font-family:'Inter', sans-serif;
    color:var(--white);
    padding:100px 0 120px;
    overflow-x:hidden;
  }
  .wrap{max-width:1000px; margin:0 auto; text-align:center; position:relative; padding:0 40px;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    font-weight:500;
    letter-spacing:4px;
    color:var(--accent);
    text-transform:uppercase;
  }
  .wordmark{
    font-size:150px;
    font-weight:800;
    letter-spacing:2px;
    color:var(--wordmark);
    line-height:1;
    margin-top:20px;
    user-select:none;
  }
  .heading{
    font-size:44px;
    font-weight:700;
    margin-top:-70px;
    letter-spacing:-0.5px;
  }
  .heading .accent-dot{color:var(--accent);}
  .sub{
    max-width:600px;
    margin:24px auto 0;
    font-size:17px;
    line-height:1.7;
    color:var(--gray);
  }

  .marquee-stack{
    margin-top:70px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .marquee-row{
    position:relative;
    overflow:hidden;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:20px 0;
    mask-image:linear-gradient(90deg, transparent, black 10%, black 90%, transparent);
    -webkit-mask-image:linear-gradient(90deg, transparent, black 10%, black 90%, transparent);
  }
  .marquee-track{
    display:flex;
    width:max-content;
    gap:0;
  }
  .marquee-track span.term{
    font-size:26px;
    font-weight:600;
    white-space:nowrap;
    padding:0 28px;
    display:flex;
    align-items:center;
    gap:28px;
  }
  .marquee-track span.term::after{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    display:inline-block;
  }

  .row-right .marquee-track{
    animation:scroll-right 34s linear infinite;
    color:var(--gray);
  }
  .row-center .marquee-track{
    animation:scroll-left 26s linear infinite;
    color:var(--white);
    font-family:'JetBrains Mono', monospace;
  }
  .row-center span.term{font-size:20px; font-weight:500;}
  .row-center span.term::after{background:var(--white); opacity:0.4;}
  .row-left .marquee-track{
    animation:scroll-left 40s linear infinite;
    color:var(--gray);
  }

  @keyframes scroll-left{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  @keyframes scroll-right{
    from{transform:translateX(-50%);}
    to{transform:translateX(0);}
  }

  @media (prefers-reduced-motion: reduce){
    .marquee-track{animation:none !important;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Terminologies</div>
    <div class="wordmark">HYNA</div>
    <h1 class="heading">The Language of<br>SaaS<span class="accent-dot">.</span></h1>
    <p class="sub">Terms you'll hear us use often — the everyday vocabulary of building and scaling a product.</p>
  </div>

  <div class="marquee-stack">
    <div class="marquee-row row-right">
      <div class="marquee-track" id="track-right"></div>
    </div>
    <div class="marquee-row row-center">
      <div class="marquee-track" id="track-center"></div>
    </div>
    <div class="marquee-row row-left">
      <div class="marquee-track" id="track-left"></div>
    </div>
  </div>

  <script>
    var rightTerms = ["MVP", "Product-Market Fit", "Onboarding", "Churn", "Multi-Tenancy", "Activation"];
    var centerTerms = ["API", "Sprint", "Wireframe", "Auth", "Deploy", "Iteration", "Roadmap"];
    var leftTerms = ["ARR", "Retention", "Scalability", "User Flow", "Backend", "Growth Loop"];

    function buildTrack(id, terms){
      var el = document.getElementById(id);
      var doubled = terms.concat(terms);
      el.innerHTML = doubled.map(function(t){
        return '<span class="term">' + t + '</span>';
      }).join('');
    }

    buildTrack('track-right', rightTerms);
    buildTrack('track-center', centerTerms);
    buildTrack('track-left', leftTerms);
  </script>
</body>
</html>
