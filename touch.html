<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyna Studio | Contact Us</title>
<style>
  :root{
    --bg:#000000;
    --panel:#0c0e12;
    --panel-border:#23262e;
    --field-bg:#111319;
    --field-border:#2a2d36;
    --text-primary:#f1f5f9;
    --text-secondary:#94a3b8;
    --text-muted:#64748b;
    --blue:#2f6bff;
    --blue-glow:#4f8cff;
    --white:#f8fafc;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text-primary);
    font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  /* NAV */
  .navwrap{
    padding:22px 24px 0;
  }
  nav{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(180deg,#0b0d11,#08090c);
    border:1px solid #24272e;
    border-radius:40px;
    padding:12px 14px 12px 18px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .logo{
    width:42px;height:42px;border-radius:10px;
    background:conic-gradient(from 180deg,#1c3d8f,#2f6bff,#5fb0ff,#1c3d8f);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:var(--white);font-size:18px;
  }
  .brand-text h1{font-size:19px;margin:0;line-height:1.1;}
  .brand-text span{
    display:block;font-size:10px;letter-spacing:1.5px;color:var(--text-muted);
    margin-top:2px;font-weight:600;
  }
  .navlinks{display:flex;align-items:center;gap:30px;}
  .navlinks a{
    color:var(--text-primary);text-decoration:none;font-size:15px;
    display:flex;align-items:center;gap:5px;font-weight:500;
  }
  .navlinks a.active{
    padding-bottom:20px;
    border-bottom:2px solid var(--blue);
  }
  .navlinks .caret{font-size:11px;color:var(--text-secondary);}
  .schedule-btn{
    background:var(--white);color:#0b0d11;border:none;
    padding:12px 24px;border-radius:24px;font-weight:600;
    font-size:14.5px;cursor:pointer;
  }

  /* HERO / HEADER */
  .container{max-width:1200px;margin:0 auto;padding:0 24px;}
  .headline{padding:70px 0 30px;}
  .headline h2{
    font-size:56px;margin:0 0 18px;font-weight:800;letter-spacing:-1px;
  }
  .headline p{
    color:var(--text-secondary);
    font-size:17px;line-height:1.6;max-width:520px;margin:0;
  }

  /* MAIN GRID */
  .main-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    padding:30px 0 60px;
    align-items:stretch;
  }
  .form-panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:20px;
    padding:32px;
  }
  .form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
  }
  .field label{
    display:block;font-size:14px;font-weight:600;margin-bottom:8px;
    color:var(--text-primary);
  }
  .field input,
  .field select,
  .field textarea{
    width:100%;
    background:var(--field-bg);
    border:1px solid var(--field-border);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text-primary);
    font-size:14.5px;
    font-family:inherit;
    outline:none;
  }
  .field input::placeholder,
  .field textarea::placeholder{color:#5b606b;}
  .field select{appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9' fill='none'><path d='M1 1L7 7L13 1' stroke='%239aa0ab' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;
    padding-right:36px;color:#9aa0ab;
  }
  .field textarea{resize:vertical;min-height:110px;}
  .field{margin-bottom:20px;}
  .field.full{margin-bottom:24px;}

  .connect-btn{
    background:#1650c9;
    color:var(--white);
    border:1px solid #3f7dff;
    padding:15px 36px;
    border-radius:30px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 0 0 1px rgba(63,125,255,0.25), 0 0 24px rgba(63,125,255,0.55);
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .connect-btn:hover{
    box-shadow:0 0 0 1px rgba(63,125,255,0.4), 0 0 34px rgba(63,125,255,0.8);
    transform:translateY(-1px);
  }

  .image-panel{
    border-radius:20px;
    overflow:hidden;
    background:#05070a;
    min-height:100%;
  }
  .image-panel img{
    width:100%;height:100%;object-fit:cover;display:block;
  }

  /* CONTACT INFO STRIP */
  .info-strip{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:40px;
    padding:20px 0 90px;
    text-align:center;
  }
  .info-item .icon{
    width:44px;height:44px;margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;
    color:var(--white);
  }
  .info-item .icon svg{width:24px;height:24px;}
  .info-item h4{margin:0 0 10px;font-size:17px;font-weight:700;}
  .info-item p{margin:0 0 4px;color:var(--text-secondary);font-size:14.5px;}
  .info-item a{color:var(--text-secondary);text-decoration:none;}
  .info-item .row{
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .info-item .row svg{width:15px;height:15px;flex-shrink:0;color:var(--text-muted);}

  @media (max-width:900px){
    .main-grid{grid-template-columns:1fr;}
    .image-panel{min-height:320px;}
    .info-strip{grid-template-columns:1fr;gap:36px;}
    .headline h2{font-size:38px;}
    .navlinks{display:none;}
  }
</style>
</head>
<body>

<div class="navwrap">
  <nav>
    <div class="brand">
      <div class="logo">H</div>
      <div class="brand-text">
        <h1>Hyna Studio</h1>
        <span>DEMOCRATIZING ENTREPRENEURSHIP</span>
      </div>
    </div>
    <div class="navlinks">
      <a href="#" class="active">Home</a>
      <a href="#">Why Us <span class="caret">▾</span></a>
      <a href="#">Forge <span class="caret">▾</span></a>
      <a href="#">Insights <span class="caret">▾</span></a>
    </div>
    <button class="schedule-btn">Schedule</button>
  </nav>
</div>

<div class="container">
  <div class="headline">
    <h2>Contact Us</h2>
    <p>Let's discuss how we can help build your next venture. We'll respond within 24 hours.</p>
  </div>

  <div class="main-grid">
    <div class="form-panel">
      <div class="form-row">
        <div class="field">
          <label>Name</label>
          <input type="text" placeholder="Your full name">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" placeholder="you@example.com">
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label>Phone Number</label>
          <input type="tel" value="+91 98765 43210">
        </div>
        <div class="field">
          <label>Company / Startup</label>
          <select>
            <option>Your company name</option>
          </select>
        </div>
      </div>

      <div class="field full">
        <label>Inquiry Type</label>
        <select>
          <option>Select an option</option>
          <option>General Inquiry</option>
          <option>Partnership</option>
          <option>Investment</option>
          <option>Support</option>
        </select>
      </div>

      <div class="field full">
        <label>Message / Project Details</label>
        <textarea placeholder="Tell us about your project or needs..."></textarea>
      </div>

      <button class="connect-btn">Let's Connect</button>
    </div>

    <div class="image-panel">
      <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=900&q=80" alt="Office desk with city skyline view">
    </div>
  </div>

  <div class="info-strip">
    <div class="info-item">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>
      <h4>Call &amp; WhatsApp</h4>
      <p>+91 98765 43210</p>
    </div>
    <div class="info-item">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      </div>
      <h4>Working Hours</h4>
      <p>Mon–Fri, 9AM–6PM</p>
    </div>
    <div class="info-item">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7L22 6"/></svg>
      </div>
      <h4>Email Us</h4>
      <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7L22 6"/></svg><a href="mailto:info@hynastudio.com">info@hynastudio.com</a></div>
      <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7L22 6"/></svg><a href="mailto:connect@hynastudio.com">connect@hynastudio.com</a></div>
    </div>
  </div>
</div>

</body>
</html>
